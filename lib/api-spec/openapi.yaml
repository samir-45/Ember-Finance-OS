openapi: 3.0.3
info:
  title: Ember Finance API
  version: 1.0.0
servers:
  - url: /api
tags:
  - name: dashboard
  - name: transactions
  - name: accounts
  - name: categories
  - name: transfers
  - name: subscriptions
  - name: budgets
  - name: goals
  - name: reports
  - name: settings
  - name: coach
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [dashboard]
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getFinanceDashboard
      tags: [dashboard]
      summary: Get the signed-in user's finance dashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List and filter transactions
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: categoryId
          in: query
          schema:
            type: string
        - name: accountId
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: paymentMethod
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Matching transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions/export:
    get:
      operationId: exportTransactions
      tags: [transactions]
      summary: Export transactions as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions/import:
    post:
      operationId: importTransactions
      tags: [transactions]
      summary: Import transactions from CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions/bulk:
    patch:
      operationId: bulkUpdateTransactions
      tags: [transactions]
      summary: Update the status or category of selected transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBulkUpdate"
      responses:
        "200":
          description: Updated transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List accounts and current balances
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List transaction categories
      responses:
        "200":
          description: User categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a transaction category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a transaction category
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transfers:
    get:
      operationId: listTransfers
      tags: [transfers]
      summary: List currency transfers
      responses:
        "200":
          description: User transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTransfer
      tags: [transfers]
      summary: Record a transfer between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Created transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List recurring subscriptions
      responses:
        "200":
          description: User subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Delete a subscription
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List monthly category budgets
      parameters:
        - name: month
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Monthly budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: upsertBudget
      tags: [budgets]
      summary: Create or update a monthly category budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "200":
          description: Saved budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List savings goals
      responses:
        "200":
          description: User goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a savings goal
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a savings goal
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reports/monthly:
    get:
      operationId: getMonthlyReport
      tags: [reports]
      summary: Get a monthly finance report
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reports/yearly:
    get:
      operationId: getYearlyReport
      tags: [reports]
      summary: Get a yearly finance report
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
      responses:
        "200":
          description: Yearly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get personal finance settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update personal finance settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/export:
    get:
      operationId: exportUserData
      tags: [settings]
      summary: Export all of the user's Ember data
      responses:
        "200":
          description: Complete JSON export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/data:
    delete:
      operationId: deleteUserData
      tags: [settings]
      summary: Permanently delete the user's Ember data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataDeletionConfirmation"
      responses:
        "204":
          description: User data deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /coach/insights:
    get:
      operationId: getCoachInsights
      tags: [coach]
      summary: Get private rule-based finance insights
      responses:
        "200":
          description: Coach insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachInsight"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /coach/review:
    post:
      operationId: createCoachReview
      tags: [coach]
      summary: Generate a monthly AI review from opted-in aggregate data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachReviewInput"
      responses:
        "200":
          description: Monthly review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachInsight"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /coach/parse-entry:
    post:
      operationId: parseQuickEntry
      tags: [coach]
      summary: Parse a natural-language transaction using a privacy-safe parser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickEntryInput"
      responses:
        "200":
          description: Parsed transaction draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickEntryDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Feature disabled by user privacy settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource is still in use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [status, timestamp]
    Currency:
      type: string
      enum: [USD, BDT]
    TransactionStatus:
      type: string
      enum: [planned, pending, done]
    TransactionType:
      type: string
      enum: [income, expense, transfer]
    MoneyPair:
      type: object
      properties:
        usdMinor:
          type: integer
        bdtMinor:
          type: integer
      required: [usdMinor, bdtMinor]
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        openingBalanceMinor:
          type: integer
        balanceMinor:
          type: integer
        color:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, type, currency, openingBalanceMinor, balanceMinor, createdAt]
    AccountInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        openingBalanceMinor:
          type: integer
          minimum: 0
        color:
          type: string
      required: [name, type, currency, openingBalanceMinor]
    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        color:
          type: string
        openingBalanceMinor:
          type: integer
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
          nullable: true
        type:
          type: string
          enum: [income, expense]
        color:
          type: string
        icon:
          type: string
      required: [id, name, type, color, icon]
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        parentId:
          type: string
          nullable: true
        type:
          type: string
          enum: [income, expense]
        color:
          type: string
        icon:
          type: string
      required: [name, type, color, icon]
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string
          nullable: true
        type:
          type: string
          enum: [income, expense]
        color:
          type: string
        icon:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        accountName:
          type: string
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/TransactionType"
        amountMinor:
          type: integer
          minimum: 0
        currency:
          $ref: "#/components/schemas/Currency"
        note:
          type: string
          nullable: true
        merchant:
          type: string
          nullable: true
        date:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        paymentMethod:
          type: string
        status:
          $ref: "#/components/schemas/TransactionStatus"
        transferId:
          type: string
          nullable: true
      required: [id, accountId, accountName, type, amountMinor, currency, date, tags, paymentMethod, status]
    TransactionInput:
      type: object
      properties:
        accountId:
          type: string
        categoryId:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/TransactionType"
        amountMinor:
          type: integer
          minimum: 1
        currency:
          $ref: "#/components/schemas/Currency"
        note:
          type: string
          nullable: true
        merchant:
          type: string
          nullable: true
        date:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        paymentMethod:
          type: string
        status:
          $ref: "#/components/schemas/TransactionStatus"
      required: [accountId, type, amountMinor, currency, date, status]
    TransactionUpdate:
      type: object
      properties:
        accountId:
          type: string
        categoryId:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/TransactionType"
        amountMinor:
          type: integer
          minimum: 1
        currency:
          $ref: "#/components/schemas/Currency"
        note:
          type: string
          nullable: true
        merchant:
          type: string
          nullable: true
        date:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        paymentMethod:
          type: string
        status:
          $ref: "#/components/schemas/TransactionStatus"
    TransactionBulkUpdate:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
        status:
          $ref: "#/components/schemas/TransactionStatus"
        categoryId:
          type: string
          nullable: true
      required: [ids]

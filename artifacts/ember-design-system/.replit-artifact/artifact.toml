kind = "design-system"
previewPath = "/ember-design-system/"
title = "Ember Design System"
description = "A reusable visual system for Ember, a premium personal finance app for freelancers earning in USD and spending in BDT. It defines a calm, dark glass interface with restrained ember accents, accessible component themes, and a living style guide."
version = "1.0.0"
id = "artifacts/ember-design-system"
router = "path"

[[services]]
name = "web"
paths = [ "/ember-design-system/" ]
localPort = 18882

[services.development]
run = "pnpm --filter @workspace/ember-design-system run dev"

[services.env]
PORT = "18882"
BASE_PATH = "/ember-design-system/"
